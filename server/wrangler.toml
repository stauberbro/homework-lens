name = "homework-lens"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Per-device rate limit: 20 requests a minute from one IP address.
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets (set with GitHub Actions, never written here):
#   ANTHROPIC_API_KEY  your Anthropic API key
#   APP_KEY            any random string; the app sends it with each request
